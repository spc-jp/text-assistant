        // --- メインアプリ ---
        function App() {
          const [activeTab, setActiveTab] = useState('template');
          const [inputText, setInputText] = useState('');
          const [outputText, setOutputText] = useState('');
          const [isCopied, setIsCopied] = useState(false);

          // デモ・ガイド用の状態
          const [isGuideOpen, setIsGuideOpen] = useState(false);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [settingsMessage, setSettingsMessage] = useState({ text: '', type: '' });

          // タブ2用の設定状態
          const [replaceKou, setReplaceKou] = useState('');
          const [replaceOtsu, setReplaceOtsu] = useState('');
          const [fixKanas, setFixKanas] = useState(true);

          // タブ3用の設定状態
          const [charsPerLine, setCharsPerLine] = useState(35);

          // テンプレートタブ用の状態
          const [openCategory, setOpenCategory] = useState('契約書類');
          const [selectedTemplate, setSelectedTemplate] = useState(null);
          const [templateLoaded, setTemplateLoaded] = useState(false);

          const colorMap = {
            blue:   { badge: 'bg-blue-100 text-blue-700', header: 'bg-blue-50 border-blue-200 text-blue-800', card: 'hover:border-blue-300 hover:bg-blue-50', btn: 'bg-blue-600 hover:bg-blue-700' },
            purple: { badge: 'bg-purple-100 text-purple-700', header: 'bg-purple-50 border-purple-200 text-purple-800', card: 'hover:border-purple-300 hover:bg-purple-50', btn: 'bg-purple-600 hover:bg-purple-700' },
            green:  { badge: 'bg-green-100 text-green-700', header: 'bg-green-50 border-green-200 text-green-800', card: 'hover:border-green-300 hover:bg-green-50', btn: 'bg-green-600 hover:bg-green-700' },
          };

          const handleLoadTemplate = (template) => {
            setSelectedTemplate(template);
            setTemplateLoaded(false);
          };

          const handleUseTemplate = () => {
            setInputText(selectedTemplate.text);
            setOutputText('');
            setTemplateLoaded(true);
            setActiveTab('layout');
          };

          const formatLayout = (text) => {
            const lines = text.split('\n');
            let currentIndentLevel = 0;
            
            return lines.map(line => {
              let trimmed = line.replace(/^[ \t　]+/, '');
              if (trimmed.length === 0) return '';

              if (/^第[一二三四五六七八九十百千0-9０-９]+[章節条]/.test(trimmed)) {
                currentIndentLevel = 0;
              } else if (/^[0-9０-９]+[\.．\s]/.test(trimmed) || /^第[一二三四五六七八九十百千0-9０-９]+項/.test(trimmed)) {
                currentIndentLevel = 1;
              } else if (/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮]/.test(trimmed) || /^[0-9０-９]+[)）]/.test(trimmed) || /^第[一二三四五六七八九十百千0-9０-９]+号/.test(trimmed)) {
                currentIndentLevel = 2;
              } else if (/^[(（]?[ア-ンあ-ん][)）]?[、\.\s]/.test(trimmed) || /^[ア-ンあ-ん][、\.]/.test(trimmed)) {
                currentIndentLevel = 3;
              } else {
                if (currentIndentLevel === 0) currentIndentLevel = 1;
              }

              const indentSpace = '　'.repeat(currentIndentLevel);
              return indentSpace + trimmed;
            }).join('\n');
          };

          const formatWords = (text) => {
            let result = text;
            if (replaceKou) result = result.replace(/甲/g, replaceKou);
            if (replaceOtsu) result = result.replace(/乙/g, replaceOtsu);
            if (fixKanas) {
              result = result.replace(/及び/g, 'および').replace(/並びに/g, 'ならびに')
                           .replace(/又は/g, 'または').replace(/若しくは/g, 'もしくは')
                           .replace(/従って/g, 'したがって').replace(/但し/g, 'ただし');
            }
            return result;
          };

          const formatForGov = (text, limit) => {
            const flatText = text.replace(/\n/g, '');
            let result = '';
            for (let i = 0; i < flatText.length; i += limit) {
              result += flatText.substring(i, i + limit) + '\n';
            }
            return result.trim();
          };

          const handleProcess = () => {
            if (!inputText.trim()) return;

            let resultText = '';
            if (activeTab === 'layout') resultText = formatLayout(inputText);
            else if (activeTab === 'words') resultText = formatWords(inputText);
            else if (activeTab === 'govForm') {
              const limit = parseInt(charsPerLine, 10);
              if (isNaN(limit) || limit < 1) return;
              resultText = formatForGov(inputText, limit);
            }

            setOutputText(resultText);
            setIsCopied(false);
          };

          const handleCopy = async () => {
            if (!outputText) return;
            try {
              await navigator.clipboard.writeText(outputText);
              setIsCopied(true);
              setTimeout(() => setIsCopied(false), 2000);
            } catch (err) {
              const textArea = document.createElement("textarea");
              textArea.value = outputText;
              document.body.appendChild(textArea);
              textArea.select();
              try {
                document.execCommand('copy');
                setIsCopied(true);
                setTimeout(() => setIsCopied(false), 2000);
              } catch (e) {}
              document.body.removeChild(textArea);
            }
          };

          const insertSample = () => {

              setInputText(`甲及び乙は、本契約を締結する。\n但し、甲又は乙のいずれかが解除を申し出た場合はこの限りではない。`);

            insertSample();
            setSettingsMessage({ text: 'デモデータをセットしました。', type: 'success' });
            setTimeout(() => setSettingsMessage({ text: '', type: '' }), 3000);

                  <button onClick={() => {setActiveTab('layout'); setOutputText('');}} className={`flex items-center gap-2 px-4 py-3 rounded-t-lg font-bold transition-colors text-sm md:text-base ${activeTab === 'layout' ? 'bg-blue-600 text-white shadow-inner' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>

                  <button onClick={() => {setActiveTab('words'); setOutputText('');}} className={`flex items-center gap-2 px-4 py-3 rounded-t-lg font-bold transition-colors text-sm md:text-base ${activeTab === 'words' ? 'bg-blue-600 text-white shadow-inner' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>

                    <div className="p-6 md:p-8 overflow-y-auto">
                      <section className="mb-8">
                        <h3 className="text-lg font-bold text-slate-800 border-b-2 border-blue-100 pb-2 mb-4 flex items-center gap-2">
                          <Zap className="w-5 h-5 text-amber-500"/>
                          アプリの目的
                        </h3>
                        <p className="text-slate-700 leading-relaxed font-medium">
                          弁護士・士業の皆様が、Wordの煩わしい体裁調整に奪われている時間をゼロにし、<span className="text-blue-700 font-bold bg-blue-50 px-1">本来の専門的な思考・執筆業務に集中できる環境</span>を提供するためのサポートツールです。
                        </p>
                      </section>
                      <section>
                        <h3 className="text-lg font-bold text-slate-800 border-b-2 border-blue-100 pb-2 mb-4 flex items-center gap-2">
                          <List className="w-5 h-5 text-blue-500"/>
                          基本的な使い方
                        </h3>
                        <ul className="space-y-6">
                          <li className="flex items-start gap-4">
                            <span className="flex-shrink-0 w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm mt-0.5">1</span>
                            <div>
                              <strong className="block text-slate-800 mb-1">タブの選択</strong>
                              <p className="text-slate-600 text-sm leading-relaxed">画面上部から、行いたい作業を選びます。</p>
                            </div>
                          </li>
                          <li className="flex items-start gap-4">
                            <span className="flex-shrink-0 w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm mt-0.5">2</span>
                            <div>
                              <strong className="block text-slate-800 mb-1">テキストの入力</strong>
                              <p className="text-slate-600 text-sm leading-relaxed">左側のエリアに、文章をコピーして貼り付けるか、直接入力します。</p>
                            </div>
                          </li>
                          <li className="flex items-start gap-4">
                            <span className="flex-shrink-0 w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm mt-0.5">3</span>
                            <div>
                              <strong className="block text-slate-800 mb-1">自動処理の実行</strong>
                              <p className="text-slate-600 text-sm leading-relaxed">中央の「→」ボタンを押すと、テキストを一瞬で整形します。</p>
                            </div>
                          </li>
                          <li className="flex items-start gap-4">
                            <span className="flex-shrink-0 w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm mt-0.5">4</span>
                            <div className="bg-blue-50 p-3 rounded-lg w-full border border-blue-100">
                              <strong className="block text-blue-900 mb-1">Wordへの貼り付け（重要）</strong>
                              <p className="text-blue-800 text-sm leading-relaxed">
                                右側の「コピー」ボタンを押し、Wordで右クリックし、<strong>「テキストのみ保持」</strong>を選んで貼り付けます。
                              </p>
                            </div>
                          </li>
                        </ul>
                      </section>
                    </div>
                  </div>
                </div>
              )}

              {/* モーダル：設定・デモデータ */}
              {isSettingsOpen && (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                    <div className="flex justify-between items-center px-6 py-4 border-b border-slate-200 bg-slate-50">
                      <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                        <Settings className="w-5 h-5 text-slate-600" /> 
                        設定・デモ操作
                      </h2>
                      <button onClick={() => setIsSettingsOpen(false)} className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-full transition-colors">
                        <X className="w-5 h-5" />
                      </button>
                    </div>
                    <div className="p-6">
                      <p className="text-sm text-slate-600 mb-6 leading-relaxed">
                        プレゼンテーション用のデモデータを操作します。現在のタブに応じたサンプルテキストが挿入されます。
                      </p>
                      <div className="flex flex-col gap-3">
                        <button onClick={handleLoadDemo} className="flex items-center justify-center gap-2 w-full py-3 px-4 bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold rounded-lg transition-colors border border-blue-200">
                          <FileText className="w-5 h-5" />
                          デモデータをセット
                        </button>
                        <button onClick={handleClearData} className="flex items-center justify-center gap-2 w-full py-3 px-4 bg-red-50 text-red-700 hover:bg-red-100 font-bold rounded-lg transition-colors border border-red-200">
                          <Trash2 className="w-5 h-5" />
                          入力データをクリア
                        </button>
                      </div>
                      <div className={`mt-4 p-3 rounded-lg flex items-center justify-center gap-2 text-sm font-bold transition-all duration-300 ${settingsMessage.text ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'} ${settingsMessage.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-slate-100 text-slate-700 border border-slate-200'}`}>
                         <Info className="w-4 h-4" />
                         {settingsMessage.text || '　'}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // アプリの起動
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
